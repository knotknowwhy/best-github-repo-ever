<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            background-color: bisque;
        }
        h1 {
            color: yellowgreen;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 45px;
            position: relative;
        }
        .buttonNejlepsiTym {
            color: bisque;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            background-color: blueviolet;
            width: 150px;
            height: 75px;
        }
        .buttonNejlepsiTym:hover {
            color:crimson;
            
        }
        .buttonDownload {
            color: bisque;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            background-color: blueviolet;
            width: 150px;
            height: 75px;
        }
        .buttonDownload:hover {
            color:crimson;
            
        }
    </style>
</head>
<body>
    <h1>Pygame</h1>
    <button class="buttonNejlepsiTym">Který tým je nejlepší?</button>
    <p class="text"></p>
    <button class="buttonDownload">Download</button>

    <script>
        const buttonNejlepsiTym = document.querySelector(".buttonNejlepsiTym")
        const buttonDownload = document.querySelector(".buttonDownload")
        const text = document.querySelector(".text")

        let pressed = false
        buttonNejlepsiTym.addEventListener("click", nejlepsiTym)

        const tymy = ["Tym1", "Tym2", "Tym3", "Tym4", "Tym5"]

        function nejlepsiTym() {
            if (pressed === false){
            const randomTym = Math.floor(Math.random()*tymy.length)
            text.textContent = tymy[randomTym]
            pressed = true
        } else if (pressed === true) {
            const randomTym = Math.floor(Math.random()*tymy.length)
            text.textContent = tymy[randomTym]
            pressed = false
        }
        }
    </script>
</body>
</html>
